<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Grill sessions</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #121212;
      --card: #1c1c1c;
      --muted: #242424;
      --ink: #f5f5f5;
      --ink-muted: #a3a3a3;
      --line: #2e2e2e;
      --accent: #f5f5f5;
      --accent-fg: #121212;
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Hiragino Sans GB", "Noto Sans SC", "Helvetica Neue", Arial, sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--font);
    }
    main { max-width: 880px; margin: 0 auto; padding: 32px 16px 64px; }
    h1 { font-size: 28px; letter-spacing: -0.03em; margin: 0 0 8px; }
    p.lead { color: var(--ink-muted); margin: 0 0 28px; }
    section { margin-bottom: 28px; }
    h2 { font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-muted); }
    ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
    li {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: center;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px 14px;
    }
    .meta { color: var(--ink-muted); font-size: 13px; }
    button {
      font: inherit;
      background: var(--accent);
      color: var(--accent-fg);
      border: 0;
      border-radius: 4px;
      min-height: 32px;
      padding: 0 12px;
      cursor: pointer;
    }
    .empty { color: var(--ink-muted); }
  </style>
</head>
<body>
  <main>
    <h1>Grill sessions</h1>
    <p class="lead">Mark completed moves a session to archived. Return to in-progress brings it back. The home directory keeps the files either way.</p>
    <section>
      <h2>In progress</h2>
      <ul id="in-progress"></ul>
    </section>
    <section>
      <h2>Archived</h2>
      <ul id="archived"></ul>
    </section>
  </main>
  <script>
    async function load() {
      const response = await fetch("/api/sessions", { cache: "no-store" });
      const data = await response.json();
      render(document.getElementById("in-progress"), data.inProgress || [], "complete", "Mark completed");
      render(document.getElementById("archived"), data.archived || [], "reopen", "Return to in-progress");
    }

    function render(list, sessions, action, label) {
      list.innerHTML = "";
      if (!sessions.length) {
        const item = document.createElement("li");
        item.className = "empty";
        item.textContent = "None";
        list.appendChild(item);
        return;
      }
      for (const session of sessions) {
        const item = document.createElement("li");
        const text = document.createElement("div");
        const title = document.createElement("strong");
        title.textContent = session.slug;
        const meta = document.createElement("div");
        meta.className = "meta";
        meta.textContent = session.title || "";
        text.append(title, meta);
        const button = document.createElement("button");
        button.type = "button";
        button.textContent = label;
        button.addEventListener("click", async () => {
          button.disabled = true;
          await fetch(`/api/sessions/${encodeURIComponent(session.slug)}/${action}`, { method: "POST" });
          await load();
        });
        item.append(text, button);
        list.appendChild(item);
      }
    }

    load();
  </script>
</body>
</html>
